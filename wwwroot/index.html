
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusTrack | Student Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #1e293b;
        }

        header {
            background: #172554;
            color: white;
            padding: 22px 7%;
        }

        header h1 {
            margin: 0;
        }

        header p {
            color: #cbd5e1;
            margin-bottom: 0;
        }

        main {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px #0000000a;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input, button {
            padding: 12px;
            border-radius: 7px;
            font-size: 14px;
        }

        input {
            border: 1px solid #cbd5e1;
            width: 100%;
        }

        button {
            border: none;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .submit-btn {
            margin-top: 18px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f8fafc;
        }

        .delete-btn {
            background: #dc2626;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        @media(max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .table-wrap {
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>CampusTrack</h1>
    <p>Student Management System | ASP.NET Core REST API</p>
</header>

<main>

    <section class="card">
        <h2>Register New Student</h2>

        <form id="studentForm">
            <div class="form-grid">

                <input id="fullName"
                       placeholder="Full Name"
                       required minlength="2" maxlength="100">

                <input id="email"
                       type="email"
                       placeholder="Email Address"
                       required>

                <input id="department"
                       placeholder="Department"
                       required maxlength="50">

                <input id="semester"
                       type="number"
                       placeholder="Semester (1-8)"
                       min="1" max="8" required>

            </div>

            <button class="submit-btn" type="submit">
                Add Student
            </button>
        </form>

        <p id="message"></p>
    </section>

    <section class="card">
        <h2>Student Records</h2>

        <button onclick="loadStudents()">Refresh Records</button>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Semester</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentTable"></tbody>
            </table>
        </div>
    </section>

</main>

<script>
    const API_URL = "/api/students";

    const form = document.getElementById("studentForm");
    const message = document.getElementById("message");
    const table = document.getElementById("studentTable");

    async function loadStudents() {
        try {
            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error("Could not load students");
            }

            const students = await response.json();

            table.innerHTML = "";

            students.forEach(student => {
                const row = document.createElement("tr");

                [
                    student.id,
                    student.fullName,
                    student.email,
                    student.department,
                    student.semester
                ].forEach(value => {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                });

                const actionCell = document.createElement("td");
                const deleteButton = document.createElement("button");

                deleteButton.textContent = "Delete";
                deleteButton.className = "delete-btn";

                deleteButton.addEventListener("click", () => {
                    deleteStudent(student.id);
                });

                actionCell.appendChild(deleteButton);
                row.appendChild(actionCell);

                table.appendChild(row);
            });

        } catch (error) {
            message.textContent = error.message;
        }
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const student = {
            fullName: document.getElementById("fullName").value.trim(),
            email: document.getElementById("email").value.trim(),
            department: document.getElementById("department").value.trim(),
            semester: Number(document.getElementById("semester").value)
        };

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(student)
            });

            const result = await response.json();

            if (!response.ok) {
                message.textContent =
                    result.errors?.join(", ") || "Unable to add student";
                return;
            }

            message.textContent = "Student added successfully!";
            form.reset();

            await loadStudents();

        } catch (error) {
            message.textContent = "Server connection failed.";
        }
    });

    async function deleteStudent(id) {
        if (!confirm("Are you sure you want to delete this student?")) {
            return;
        }

        try {
            const response = await fetch(`${API_URL}/${id}`, {
                method: "DELETE"
            });

            if (!response.ok) {
                throw new Error("Unable to delete student");
            }

            message.textContent = "Student deleted successfully!";

            await loadStudents();

        } catch (error) {
            message.textContent = error.message;
        }
    }

    loadStudents();
</script>

</body>
</html>
